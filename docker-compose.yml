name: delivery

services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: delivery
      DB_USER: delivery
      DB_PASSWORD: delivery
      DB_SSLMODE: disable
      HTTP_PORT: "8082"
    ports:
      - "8082:8082"
    volumes:
      - .:/workspace:cached
      - maven-repo:/home/vscode/.m2

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maven-repo:
  postgres-data:
